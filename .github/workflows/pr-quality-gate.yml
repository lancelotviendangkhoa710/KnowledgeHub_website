name: PR Quality Gate

on:
  pull_request:
    branches:
      - dev
      - main
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  guardrails:
    name: Architecture Guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run repository guardrails
        shell: pwsh
        env:
          PR_BASE_REF: ${{ github.base_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/test-guardrails.ps1 -BaseRef "origin/$env:PR_BASE_REF" -HeadRef "$env:PR_HEAD_SHA" -RequireTaskId

  # ─── Job 1: Kiểm tra tên branch đúng convention ───────────────────────────
  branch-convention:
    name: Branch Naming Convention
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          BRANCH="$PR_HEAD_REF"
          echo "Branch: $BRANCH"
          # Phải bắt đầu bằng p1/, p2/, p3/, hotfix/, release/
          if [[ ! "$BRANCH" =~ ^(p1|p2|p3|hotfix|release)/.+ ]]; then
            echo "❌ Branch name '$BRANCH' không đúng convention."
            echo "✅ Đúng: p1/article-api, p2/login-page, p3/docker-setup"
            exit 1
          fi
          echo "✅ Branch name OK"

  # ─── Job 2: Kiểm tra commit message ──────────────────────────────────────
  commit-convention:
    name: Commit Message Convention
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages
        env:
          PR_BASE_REF: ${{ github.base_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Lấy các commit trong PR (không có trong base branch)
          COMMITS=$(git log "origin/$PR_BASE_REF".."$PR_HEAD_SHA" --format="%s")
          echo "Commits to check:"
          echo "$COMMITS"

          FAIL=0
          while IFS= read -r msg; do
            # Bỏ qua dòng trống
            [ -z "$msg" ] && continue
            # Phải bắt đầu bằng p1:, p2:, p3:, docs:, fix:, chore:
            if [[ ! "$msg" =~ ^(p1|p2|p3|docs|fix|chore|hotfix|release): ]]; then
              echo "❌ Commit không đúng format: '$msg'"
              echo "   Cần: 'p1: mô tả' hoặc 'p2: mô tả' hoặc 'docs: mô tả'"
              FAIL=1
            else
              echo "✅ OK: '$msg'"
            fi
          done <<< "$COMMITS"

          [ $FAIL -eq 1 ] && exit 1
          echo "✅ Tất cả commit messages đúng convention"

  # ─── Job 3: Laravel Test ──────────────────────────────────────────────────
  laravel-test:
    name: Laravel Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare isolated environment
        run: cp backend/.env.example backend/.env

      - name: Start disposable test database
        run: docker compose --profile test up -d --wait test-db

      - name: Generate test application key
        run: docker compose run --rm --no-deps app php artisan key:generate --force

      - name: Verify inherited database settings cannot redirect tests
        run: >-
          docker compose run --rm --no-deps
          -e DB_HOST=blocked.invalid -e DB_DATABASE=shared
          -e DB_URL=postgresql://blocked.invalid/shared
          app php vendor/bin/phpunit tests/Unit/Content/TagModelTest.php

      - name: Verify cached configuration is blocked
        run: |
          docker compose run --rm --no-deps app php artisan config:cache
          trap 'docker compose run --rm --no-deps app php artisan config:clear' EXIT
          if docker compose run --rm --no-deps app php vendor/bin/phpunit --list-tests > /tmp/phpunit-cache-guard.log 2>&1; then
            echo "PHPUnit unexpectedly accepted cached configuration"
            exit 1
          fi
          grep -q 'Clear Laravel config cache before running tests' /tmp/phpunit-cache-guard.log

      - name: Run tests
        run: docker compose run --rm --no-deps app php vendor/bin/phpunit --stop-on-failure

      - name: Stop test containers
        if: always()
        run: docker compose --profile test down

  # ─── Job 4: Block merge nếu chưa có CodeRabbit approve ───────────────────
  coderabbit-approved:
    name: CodeRabbit Review Required
    runs-on: ubuntu-latest
    steps:
      - name: Check CodeRabbit review status
        uses: actions/github-script@v7
        with:
          script: |
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            // Tìm review mới nhất của coderabbitai
            const coderabbitReviews = reviews.filter(
              r => r.user.login === 'coderabbitai[bot]'
            );

            if (coderabbitReviews.length === 0) {
              // CodeRabbit's free OSS quota can be exhausted; an external quota
              // notice must not turn every PR red. Keep failing for a missing
              // review when there is no such notice.
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              });
              const quotaExhausted = comments.some(
                (comment) => comment.user.login === 'coderabbitai[bot]'
                  && /review limit reached|rate limit|does not receive automatic reviews|skip review/i.test(comment.body || '')
              );

              if (quotaExhausted) {
                core.warning('⚠️ CodeRabbit review quota exhausted; skipping the review gate.');
                return;
              }

              core.setFailed(
                '❌ CodeRabbit chưa review PR này.\n' +
                'Chờ @coderabbitai[bot] comment tự động, hoặc comment "@coderabbitai review" để trigger thủ công.'
              );
              return;
            }

            // Kiểm tra có summary chưa (không phải chỉ có changes_requested)
            const latestReview = coderabbitReviews[coderabbitReviews.length - 1];
            console.log(`CodeRabbit latest review state: ${latestReview.state}`);

            if (latestReview.state === 'CHANGES_REQUESTED') {
              core.setFailed('❌ CodeRabbit yêu cầu sửa trước khi merge.');
            } else {
              console.log('✅ CodeRabbit đã review xong');
            }
