name: AI service keep-warm

# Render free instances sleep after ~15 minutes of inactivity. The first API
# request after a sleep can take 30-60s and currently surfaces as a 502. Ping
# both Render services just under that window so the AI Companion stays warm.
#
# Runs from the repository default branch (dev). Public repository, so these
# schedule runs do not consume paid Actions minutes.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ai-service-keepwarm
  cancel-in-progress: false

jobs:
  ping:
    name: Ping Render services
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake Laravel API
        run: |
          curl -sS --retry 3 --retry-delay 5 --retry-all-errors \
            --max-time 90 -o /dev/null \
            -w 'backend /up HTTP %{http_code} in %{time_total}s\n' \
            https://knowledgehub-website.onrender.com/up || true

      - name: Wake FastAPI AI service
        run: |
          curl -sS --retry 3 --retry-delay 10 --retry-all-errors \
            --max-time 120 -o /dev/null \
            -w 'ai-service /health HTTP %{http_code} in %{time_total}s\n' \
            https://knowledgehub-ai-service.onrender.com/health || true
