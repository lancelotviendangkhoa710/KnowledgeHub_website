services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: knowledgehub_app
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - ./database:/var/www/html/database
    environment:
      - APP_ENV=local
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=knowledgehub
      - DB_USERNAME=knowledgehub
      - DB_PASSWORD=secret
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - knowledgehub

  postgres:
    image: postgres:16.10-alpine3.21
    container_name: knowledgehub_postgres
    environment:
      POSTGRES_DB: knowledgehub
      POSTGRES_USER: knowledgehub
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledgehub -d knowledgehub"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - knowledgehub

  nginx:
    image: nginx:1.27.4-alpine3.21
    container_name: knowledgehub_nginx
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - knowledgehub

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: knowledgehub_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    depends_on:
      - nginx
    networks:
      - knowledgehub

volumes:
  postgres_data:
  frontend_node_modules:
  frontend_next:

networks:
  knowledgehub:
    driver: bridge
