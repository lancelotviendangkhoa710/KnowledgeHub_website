version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: knowledgehub_app
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - ./database:/var/www/html/database
    environment:
      - APP_ENV=local
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - knowledgehub

  postgres:
    image: postgres:16-alpine
    container_name: knowledgehub_postgres
    environment:
      POSTGRES_DB: knowledgehub
      POSTGRES_USER: knowledgehub
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledgehub -d knowledgehub"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - knowledgehub

  nginx:
    image: nginx:alpine
    container_name: knowledgehub_nginx
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - knowledgehub

volumes:
  postgres_data:

networks:
  knowledgehub:
    driver: bridge
