services:
  test-db:
    profiles: [test]
    image: postgres:16.10-alpine3.21
    environment:
      POSTGRES_DB: knowledgehub_test
      POSTGRES_USER: knowledgehub_test
      POSTGRES_PASSWORD: local-test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledgehub_test -d knowledgehub_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [knowledgehub]

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - ./database:/var/www/html/database
      - backend_vendor:/var/www/html/vendor
    env_file: ./backend/.env
    environment:
      AI_SERVICE_URL: http://ai-service:8000
    networks: [knowledgehub]

  nginx:
    image: nginx:1.27.4-alpine3.21
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [knowledgehub]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    environment:
      NEXT_PUBLIC_API_URL: /api
      BACKEND_INTERNAL_URL: http://nginx
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    depends_on: [nginx]
    networks: [knowledgehub]

  ai-service:
    environment:
      LOG_LEVEL: INFO
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    env_file: ./backend/.env
    volumes:
      - ./ai-service/app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    stop_grace_period: 45s
    networks: [knowledgehub]

volumes:
  backend_vendor:
  frontend_node_modules:
  frontend_next:

networks:
  knowledgehub:
    driver: bridge
