# Isolated local agent validation. Always combine with docker-compose.yml.
# The app uses the existing disposable test-db and private local CV storage.
services:
  nginx:
    ports: !override
      - "127.0.0.1:8080:80"
  app:
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: test-db
      DB_PORT: "5432"
      DB_DATABASE: knowledgehub_test
      DB_USERNAME: knowledgehub_test
      DB_PASSWORD: local-test
      DB_URL: ""
      DB_SSLMODE: disable
      CV_STORAGE_DRIVER: local
      AI_AGENT_COURSES_ENABLED: "true"
      AI_AGENT_ADMIN_ENABLED: "true"
      AI_AGENT_CV_ENABLED: "true"
  ai-service:
    environment:
      AI_AGENTS_ENABLED: "true"
