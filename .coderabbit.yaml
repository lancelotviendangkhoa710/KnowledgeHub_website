# CodeRabbit AI PR Reviewer Configuration
# Docs: https://docs.coderabbit.ai/configure/coderabbitai-yaml

language: "vi"

reviews:
  # Tự động review mọi PR
  auto_review:
    enabled: true
    # Chỉ review khi PR vào dev hoặc main
    base_branches:
      - "dev"
      - "main"
    # Bỏ qua draft PR
    drafts: false

  # Mức độ review
  profile: "assertive"

  # Những gì CodeRabbit sẽ check
  request_changes_workflow: true

  poem: false          # Tắt thơ cuối review (mặc định bật, hơi spam)
  collapse_walkthrough: false

  path_instructions:
    - path: "AGENTS.md"
      instructions: |
        Review only for consistency with approved ADRs and ownership boundaries.
        Flag changes that weaken stop conditions, authorization, security, or scope controls.

    - path: "docs/**"
      instructions: |
        Treat approved ADRs as architecture authority. Flag undocumented API/schema changes,
        conflicts with approved decisions, or planned work presented as implemented.

    - path: ".github/**"
      instructions: |
        Review CI and templates as security controls. Flag bypasses of tests, guardrails,
        review requirements, branch rules, or secret checks.

    # Hướng dẫn riêng cho từng phần codebase
    - path: "database/migrations/**"
      instructions: |
        Review migration files:
        - UUID primary keys (not integer)
        - timestampTz for all timestamps (not timestamp)
        - Explicit foreign key cascade rules defined
        - Rollback (down method) implemented
        - No dropping columns/tables without comment explaining why

    - path: "backend/app/Http/Controllers/**"
      instructions: |
        Review Laravel controllers:
        - All queries use parameter binding (no raw SQL string concat)
        - Soft-delete filter (deleted_at IS NULL) applied where needed
        - Response format consistent: { data, message, status }
        - No business logic in controller (delegate to Service/Model)
        - Mutating endpoints authorize via Policy/Gate

    - path: "backend/app/Policies/**"
      instructions: |
        Test Guest, User, Contributor, and Admin. Contributors access only owned content.
        Admin retains platform-wide management. No reviewer/learner role or review workflow.

    - path: "backend/app/Models/**"
      instructions: |
        Review Eloquent models:
        - $fillable or $guarded defined
        - Relationships defined correctly
        - Soft deletes trait used where table has deleted_at

    - path: "frontend/src/**"
      instructions: |
        Review frontend code:
        - No hardcoded API URLs (use env variables)
        - No console.log left in production code
        - Loading and error states handled in UI components

chat:
  # Cho phép mention @coderabbitai trong comment để hỏi
  auto_reply: true
